<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Modern Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 h-screen flex">

    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 text-white flex flex-col flex-shrink-0">
        <div class="p-5 text-xl font-bold border-b border-slate-700">MyApp</div>
        <nav class="flex-1 py-4">
            <a href="index.html" class="block px-5 py-3 text-slate-300 hover:bg-slate-800 hover:text-white transition">Dashboard</a>
            <a href="analytics.html" class="block px-5 py-3 text-slate-300 hover:bg-slate-800 hover:text-white transition">Analytics</a>
            <a href="projects.html" class="block px-5 py-3 text-slate-300 hover:bg-slate-800 hover:text-white transition">Projects</a>
            <a href="tasks.html" class="block px-5 py-3 text-slate-300 hover:bg-slate-800 hover:text-white transition">Tasks</a>
            <a href="settings.html" class="block px-5 py-3 bg-slate-800 text-white font-medium">Settings</a>
        </nav>
        <div class="p-5 border-t border-slate-700 text-sm text-slate-400">v1.0.0</div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col min-w-0">
        <!-- Header -->
        <header class="bg-white shadow-sm px-6 py-4 flex items-center justify-between flex-shrink-0">
            <h2 class="text-lg font-semibold text-slate-800">Settings</h2>
            <div class="flex items-center gap-4">
                <span id="user-email" class="text-sm text-gray-600 hidden sm:inline">clauxz@gmail.com</span>
                <div class="w-9 h-9 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-sm">C</div>
                <button id="logout-btn"
                    class="bg-red-500 hover:bg-red-600 text-white text-sm font-medium px-4 py-2 rounded-lg transition duration-200">
                    Log Out
                </button>
            </div>
        </header>

        <!-- Content -->
        <main class="flex-1 overflow-y-auto p-6">
            <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-md p-6">
                <h1 class="text-2xl font-bold text-gray-800 mb-6">Settings</h1>

                <div class="space-y-6">
                    <div>
                        <h3 class="text-lg font-semibold text-gray-700 mb-3">Profile</h3>
                        <div class="space-y-3">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                                <input type="email" value="clauxz@gmail.com" disabled
                                    class="w-full px-4 py-2 bg-gray-100 border border-gray-300 rounded-lg text-gray-600 cursor-not-allowed">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Display Name</label>
                                <input type="text" value="clauxz"
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                        </div>
                    </div>

                    <hr class="border-gray-200">

                    <div>
                        <h3 class="text-lg font-semibold text-gray-700 mb-3">Preferences</h3>
                        <div class="flex items-center justify-between py-2">
                            <span class="text-gray-700">Email notifications</span>
                            <input type="checkbox" checked class="w-5 h-5 text-blue-600 rounded focus:ring-blue-500">
                        </div>
                        <div class="flex items-center justify-between py-2">
                            <span class="text-gray-700">Dark mode</span>
                            <input type="checkbox" class="w-5 h-5 text-blue-600 rounded focus:ring-blue-500">
                        </div>
                    </div>

                    <div class="pt-4">
                        <button class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-2 rounded-lg transition duration-200">
                            Save Changes
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const userEmail = document.getElementById('user-email');
        const savedEmail = localStorage.getItem('userEmail') || 'clauxz@gmail.com';
        userEmail.textContent = savedEmail;

        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = 'index.html';
        }

        document.getElementById('logout-btn').addEventListener('click', function () {
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('userEmail');
            window.location.href = 'index.html';
        });
    </script>

</body>
</html>
