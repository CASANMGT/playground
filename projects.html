<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - Modern Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 h-screen flex">

    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 text-white flex flex-col flex-shrink-0">
        <div class="p-5 text-xl font-bold border-b border-slate-700">MyApp</div>
        <nav class="flex-1 py-4">
            <a href="index.html" class="block px-5 py-3 text-slate-300 hover:bg-slate-800 hover:text-white transition">Dashboard</a>
            <a href="analytics.html" class="block px-5 py-3 text-slate-300 hover:bg-slate-800 hover:text-white transition">Analytics</a>
            <a href="projects.html" class="block px-5 py-3 bg-slate-800 text-white font-medium">Projects</a>
            <a href="tasks.html" class="block px-5 py-3 text-slate-300 hover:bg-slate-800 hover:text-white transition">Tasks</a>
            <a href="settings.html" class="block px-5 py-3 text-slate-300 hover:bg-slate-800 hover:text-white transition">Settings</a>
        </nav>
        <div class="p-5 border-t border-slate-700 text-sm text-slate-400">v1.0.0</div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col min-w-0">
        <!-- Header -->
        <header class="bg-white shadow-sm px-6 py-4 flex items-center justify-between flex-shrink-0">
            <h2 class="text-lg font-semibold text-slate-800">Projects</h2>
            <div class="flex items-center gap-4">
                <span id="user-email" class="text-sm text-gray-600 hidden sm:inline">clauxz@gmail.com</span>
                <div class="w-9 h-9 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-sm">C</div>
                <button id="logout-btn"
                    class="bg-red-500 hover:bg-red-600 text-white text-sm font-medium px-4 py-2 rounded-lg transition duration-200">
                    Log Out
                </button>
            </div>
        </header>

        <!-- Content -->
        <main class="flex-1 overflow-y-auto p-6">
            <div class="max-w-5xl mx-auto bg-white rounded-xl shadow-md p-6">
                <div class="flex items-center justify-between mb-6">
                    <h1 class="text-2xl font-bold text-gray-800">Projects</h1>
                    <button class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg transition duration-200">
                        New Project
                    </button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="border border-gray-200 rounded-lg p-5 hover:shadow-md transition">
                        <h3 class="text-lg font-semibold text-gray-800">Website Redesign</h3>
                        <p class="text-gray-500 text-sm mt-1">In Progress</p>
                        <div class="mt-4 w-full bg-gray-200 rounded-full h-2">
                            <div class="bg-blue-600 h-2 rounded-full" style="width: 65%"></div>
                        </div>
                    </div>

                    <div class="border border-gray-200 rounded-lg p-5 hover:shadow-md transition">
                        <h3 class="text-lg font-semibold text-gray-800">Mobile App</h3>
                        <p class="text-gray-500 text-sm mt-1">Planning</p>
                        <div class="mt-4 w-full bg-gray-200 rounded-full h-2">
                            <div class="bg-yellow-500 h-2 rounded-full" style="width: 25%"></div>
                        </div>
                    </div>

                    <div class="border border-gray-200 rounded-lg p-5 hover:shadow-md transition">
                        <h3 class="text-lg font-semibold text-gray-800">API Integration</h3>
                        <p class="text-gray-500 text-sm mt-1">Completed</p>
                        <div class="mt-4 w-full bg-gray-200 rounded-full h-2">
                            <div class="bg-green-500 h-2 rounded-full" style="width: 100%"></div>
                        </div>
                    </div>

                    <div class="border border-gray-200 rounded-lg p-5 hover:shadow-md transition">
                        <h3 class="text-lg font-semibold text-gray-800">Marketing Campaign</h3>
                        <p class="text-gray-500 text-sm mt-1">In Progress</p>
                        <div class="mt-4 w-full bg-gray-200 rounded-full h-2">
                            <div class="bg-blue-600 h-2 rounded-full" style="width: 50%"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const userEmail = document.getElementById('user-email');
        const savedEmail = localStorage.getItem('userEmail') || 'clauxz@gmail.com';
        userEmail.textContent = savedEmail;

        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = 'index.html';
        }

        document.getElementById('logout-btn').addEventListener('click', function () {
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('userEmail');
            window.location.href = 'index.html';
        });
    </script>

</body>
</html>
