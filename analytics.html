<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - Modern Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 h-screen flex">

    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 text-white flex flex-col flex-shrink-0">
        <div class="p-5 text-xl font-bold border-b border-slate-700">MyApp</div>
        <nav class="flex-1 py-4">
            <a href="index.html" class="block px-5 py-3 text-slate-300 hover:bg-slate-800 hover:text-white transition">Dashboard</a>
            <a href="analytics.html" class="block px-5 py-3 bg-slate-800 text-white font-medium">Analytics</a>
            <a href="projects.html" class="block px-5 py-3 text-slate-300 hover:bg-slate-800 hover:text-white transition">Projects</a>
            <a href="tasks.html" class="block px-5 py-3 text-slate-300 hover:bg-slate-800 hover:text-white transition">Tasks</a>
            <a href="settings.html" class="block px-5 py-3 text-slate-300 hover:bg-slate-800 hover:text-white transition">Settings</a>
        </nav>
        <div class="p-5 border-t border-slate-700 text-sm text-slate-400">v1.0.0</div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col min-w-0">
        <!-- Header -->
        <header class="bg-white shadow-sm px-6 py-4 flex items-center justify-between flex-shrink-0">
            <h2 class="text-lg font-semibold text-slate-800">Analytics</h2>
            <div class="flex items-center gap-4">
                <span id="user-email" class="text-sm text-gray-600 hidden sm:inline">clauxz@gmail.com</span>
                <div class="w-9 h-9 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-sm">C</div>
                <button id="logout-btn"
                    class="bg-red-500 hover:bg-red-600 text-white text-sm font-medium px-4 py-2 rounded-lg transition duration-200">
                    Log Out
                </button>
            </div>
        </header>

        <!-- Content -->
        <main class="flex-1 overflow-y-auto p-6">
            <div class="max-w-5xl mx-auto bg-white rounded-xl shadow-md p-6">
                <h1 class="text-2xl font-bold text-gray-800 mb-6">Analytics</h1>

                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                    <div class="bg-blue-50 rounded-lg p-5">
                        <p class="text-sm text-blue-600 font-medium">Total Views</p>
                        <p class="text-3xl font-bold text-blue-900 mt-1">12,345</p>
                    </div>
                    <div class="bg-green-50 rounded-lg p-5">
                        <p class="text-sm text-green-600 font-medium">Active Users</p>
                        <p class="text-3xl font-bold text-green-900 mt-1">1,234</p>
                    </div>
                    <div class="bg-purple-50 rounded-lg p-5">
                        <p class="text-sm text-purple-600 font-medium">Bounce Rate</p>
                        <p class="text-3xl font-bold text-purple-900 mt-1">42%</p>
                    </div>
                    <div class="bg-orange-50 rounded-lg p-5">
                        <p class="text-sm text-orange-600 font-medium">Avg. Session</p>
                        <p class="text-3xl font-bold text-orange-900 mt-1">3m 21s</p>
                    </div>
                </div>

                <div class="bg-gray-50 rounded-lg p-6">
                    <h2 class="text-lg font-semibold text-gray-700 mb-3">Traffic Overview</h2>
                    <p class="text-gray-600">Charts and detailed reports would go here.</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        const userEmail = document.getElementById('user-email');
        const savedEmail = localStorage.getItem('userEmail') || 'clauxz@gmail.com';
        userEmail.textContent = savedEmail;

        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = 'index.html';
        }

        document.getElementById('logout-btn').addEventListener('click', function () {
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('userEmail');
            window.location.href = 'index.html';
        });
    </script>

</body>
</html>
